<svg width="420" height="380" viewBox="0 0 420 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="craftoGrad1" x1="40" y1="20" x2="380" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB27D" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#FF9857" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#FF7A30" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#E05D15" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="craftoHighlight" x1="80" y1="40" x2="280" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFB27D" stop-opacity="0" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Under-Glow -->
  <path d="M70 180 C110 90, 240 40, 340 90 C390 120, 360 220, 290 270 C210 330, 110 310, 70 250 C50 220, 50 200, 70 180 Z" fill="#FF9857" opacity="0.25" filter="url(#softGlow)" />

  <!-- Main Sculptural Ribbon Body -->
  <path d="M60 210 C100 80, 250 30, 350 85 C395 115, 375 205, 305 255 C220 320, 120 300, 75 245 C55 220, 50 210, 60 210 Z" fill="url(#craftoGrad1)" />

  <!-- Secondary Inner Fold / Wing Curve -->
  <path d="M120 220 C160 130, 280 90, 345 130 C370 150, 350 210, 295 245 C230 290, 155 275, 120 220 Z" fill="url(#craftoHighlight)" />

  <!-- Fine Sculptural Quill Ridges -->
  <path d="M100 240 Q 210 170 320 110" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2.5" stroke-linecap="round" />
  <path d="M140 260 Q 230 200 300 160" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5" stroke-linecap="round" />
  <path d="M80 200 Q 180 130 280 80" stroke="#FFE3D1" stroke-opacity="0.35" stroke-width="1.8" stroke-linecap="round" />
</svg>
