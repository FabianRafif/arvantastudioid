<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="oliveBgM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#777B61" />
      <stop offset="100%" stop-color="#4E513E" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#oliveBgM)" />
  <circle cx="560" cy="40" r="140" fill="#FFFFFF" fill-opacity="0.06" />
  <circle cx="40" cy="420" r="120" fill="#000000" fill-opacity="0.12" />

  <!-- Outer Frame -->
  <rect x="18" y="18" width="564" height="414" rx="4" fill="none" stroke="#F4F1EA" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Badge Pill -->
  <g transform="translate(32, 32)">
    <rect x="0" y="0" width="210" height="28" rx="3" fill="#F4F1EA" />
    <text x="14" y="19" fill="#20211F" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">GRAPHIC DESIGN STUDIO</text>
  </g>

  <!-- Main Headline -->
  <text x="32" y="100" fill="#F4F1EA" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-1">
    Visual Identity &amp;
  </text>
  <text x="32" y="140" fill="#F4F1EA" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-1">
    Branding Desain
  </text>

  <!-- Subtitle -->
  <text x="32" y="174" fill="#EAE7DC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">
    15+ Kategori: Logo, Feed IG, Brosur, Poster, Banner &amp; Kemasan
  </text>

  <!-- Category Pills (Stacked for Mobile) -->
  <g transform="translate(32, 196)">
    <rect x="0" y="0" width="105" height="26" rx="13" fill="#F4F1EA" fill-opacity="0.2" />
    <text x="14" y="17" fill="#F4F1EA" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Logo Design</text>

    <rect x="115" y="0" width="115" height="26" rx="13" fill="#F4F1EA" fill-opacity="0.2" />
    <text x="128" y="17" fill="#F4F1EA" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Brand Identity</text>

    <rect x="240" y="0" width="125" height="26" rx="13" fill="#F4F1EA" fill-opacity="0.2" />
    <text x="252" y="17" fill="#F4F1EA" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Social Media</text>

    <rect x="375" y="0" width="135" height="26" rx="13" fill="#F4F1EA" fill-opacity="0.2" />
    <text x="388" y="17" fill="#F4F1EA" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Kemasan &amp; Poster</text>
  </g>

  <!-- Highlight Promo Card at Bottom -->
  <g transform="translate(32, 240)">
    <rect x="0" y="0" width="536" height="170" rx="6" fill="#20211F" />
    
    <!-- Top Row inside Card -->
    <text x="24" y="32" fill="#777B61" font-family="monospace" font-size="11" font-weight="700" letter-spacing="2">FLASH SALE 11.11 ARVANTA</text>
    <text x="24" y="66" fill="#F4F1EA" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">Paket Branding Lengkap</text>
    <text x="24" y="94" fill="#D9D7CF" font-family="system-ui, -apple-system, sans-serif" font-size="12">Master File AI, PSD, PDF, PNG resolusi tinggi siap cetak</text>

    <!-- Pricing Row & CTA Button -->
    <g transform="translate(24, 112)">
      <text x="0" y="32" fill="#F4F1EA" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900">Rp119.000</text>
      <text x="155" y="30" fill="#A0A299" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-decoration="line-through">Rp199rb</text>

      <!-- CTA Button -->
      <g transform="translate(260, 4)">
        <rect x="0" y="0" width="228" height="38" rx="3" fill="#F4F1EA" />
        <text x="24" y="24" fill="#20211F" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">KATALOG DESAIN →</text>
      </g>
    </g>
  </g>
</svg>
