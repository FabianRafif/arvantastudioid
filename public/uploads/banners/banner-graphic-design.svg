<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600">
  <defs>
    <linearGradient id="oliveBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#777B61" />
      <stop offset="100%" stop-color="#555845" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="600" fill="url(#oliveBg)" />

  <circle cx="1500" cy="100" r="300" fill="#FFFFFF" fill-opacity="0.05" />
  <circle cx="100" cy="500" r="250" fill="#000000" fill-opacity="0.1" />

  <!-- Layout Frame -->
  <rect x="50" y="50" width="1500" height="500" rx="6" fill="none" stroke="#F4F1EA" stroke-opacity="0.3" stroke-width="2" />

  <!-- Badge -->
  <rect x="90" y="90" width="260" height="36" rx="4" fill="#F4F1EA" />
  <text x="106" y="113" fill="#20211F" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2">GRAPHIC DESIGN STUDIO</text>

  <!-- Main Headline -->
  <text x="90" y="210" fill="#F4F1EA" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5">
    Visual Identity &amp; Branding
  </text>
  <text x="90" y="260" fill="#E6E4DC" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="400">
    15+ Kategori Desain: Logo, Feed Media Sosial, Kemasan, Brosur, Poster, hingga Banner
  </text>

  <!-- Categories Pill Grid -->
  <g transform="translate(90, 310)">
    <rect x="0" y="0" width="140" height="36" rx="18" fill="#F4F1EA" fill-opacity="0.15" />
    <text x="24" y="23" fill="#F4F1EA" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Logo Design</text>

    <rect x="155" y="0" width="160" height="36" rx="18" fill="#F4F1EA" fill-opacity="0.15" />
    <text x="175" y="23" fill="#F4F1EA" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Brand Identity</text>

    <rect x="330" y="0" width="170" height="36" rx="18" fill="#F4F1EA" fill-opacity="0.15" />
    <text x="350" y="23" fill="#F4F1EA" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Social Media Feed</text>

    <rect x="515" y="0" width="155" height="36" rx="18" fill="#F4F1EA" fill-opacity="0.15" />
    <text x="535" y="23" fill="#F4F1EA" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Poster &amp; Banner</text>

    <rect x="685" y="0" width="170" height="36" rx="18" fill="#F4F1EA" fill-opacity="0.15" />
    <text x="705" y="23" fill="#F4F1EA" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Packaging Design</text>
  </g>

  <!-- CTA Box -->
  <g transform="translate(90, 410)">
    <rect x="0" y="0" width="300" height="56" rx="4" fill="#F4F1EA" />
    <text x="36" y="34" fill="#20211F" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1">LIHAT KATALOG DESAIN →</text>
    <text x="330" y="34" fill="#F4F1EA" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Mulai Rp50.000 / desain • File Master AI, PSD, PDF, PNG</text>
  </g>

  <!-- Right Visual Highlight -->
  <g transform="translate(1080, 100)">
    <rect x="0" y="0" width="420" height="400" rx="8" fill="#20211F" />
    <text x="40" y="55" fill="#777B61" font-family="monospace" font-size="12" letter-spacing="2">FLASH SALE 11.11 ARVANTA</text>
    <text x="40" y="105" fill="#F4F1EA" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800">Paket Branding Lengkap</text>
    <text x="40" y="145" fill="#D9D7CF" font-family="system-ui, -apple-system, sans-serif" font-size="14" line-height="1.5">
      Dapatkan potongan harga khusus untuk pembuatan identitas visual bisnis, panduan warna, font, dan template sosial media.
    </text>

    <rect x="40" y="195" width="340" height="110" rx="4" fill="#2A2B28" stroke="#777B61" stroke-width="1" />
    <text x="60" y="230" fill="#A0A299" font-family="system-ui, -apple-system, sans-serif" font-size="13">Harga Normal: Rp150.000</text>
    <text x="60" y="270" fill="#F4F1EA" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800">Rp119.000</text>
    <text x="240" y="270" fill="#777B61" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">HEMAT 20%</text>

    <text x="40" y="355" fill="#777B61" font-family="monospace" font-size="12">100% Original Vector &amp; Siap Cetak</text>
  </g>

  <!-- Dimension Indicator -->
  <text x="1420" y="525" fill="#F4F1EA" fill-opacity="0.6" font-family="monospace" font-size="11" letter-spacing="1">160 × 60 cm</text>
</svg>